name: GetItems, store origin
description: >-
  Spike S3. The Origin a content script on the store page sends. Record access-control-allow-
  origin and access-control-expose-headers.
method: GET
url: https://api.steampowered.com/IStoreBrowseService/GetItems/v1
headers:
  - name: Origin
    value: https://store.steampowered.com
params:
  - name: input_json
    value: >-
      {"ids": [{"appid": 5072580}, {"appid": 1808500}, {"appid": 413150}],
      "context": {"language": "english", "country_code": "US"},
      "data_request": {"include_extra_details": true}}
scripts:
  on_response: scripts/record_headers.py
options:
  attach_cookies: false
