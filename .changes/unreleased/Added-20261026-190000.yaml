kind: Added
body: A demo now shows the tags of its full game, in search results, on the wishlist, on sale pages such as Next Fest and in the hover card, so a demo row is no longer bare when the full game declares AI use, a kernel level anti-cheat, 3rd-party DRM and the like. The hover card and the banner on the demo's own page say "Declared for the full game" under each such tag, and the demo's own declaration for a tag, when it has one, is shown instead. These tags follow the same switches, list filters and ignore lists as any other, and ignoring the full game also covers its demos. Tag Kit looks the full games up in the same kind of batched request to Steam as every other game, once per page for the full games it has not seen, and DLC still show only their own tags. Stored lookup results from before are cleared once, so each game is checked again as you browse.
