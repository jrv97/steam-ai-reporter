kind: Changed
body: The short description of the extension, which Chrome shows on its store page and in the browser's extension list and which the userscript carries in its header, used to stop at PvP. It now names more of what Tag Kit tags, including AI disclosure, anti-cheat, DRM, Steam Deck and Family Sharing, and ends by saying the extension collects nothing. The Spanish description was reworded to match, in Steam's own Spanish terms.
