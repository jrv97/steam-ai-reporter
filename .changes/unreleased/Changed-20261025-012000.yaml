kind: Changed
body: The AI badge now reads AI, and its card and the notice on a game's page carry Steam's own heading for the disclosure, "AI Generated Content Disclosure", in English and in Steam's Spain Spanish wording. They replace the label "AI use reported". The card ends with a line that names the developer as the source.
