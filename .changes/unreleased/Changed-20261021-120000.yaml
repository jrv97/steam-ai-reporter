kind: Changed
body: Badges now appear on Next Fest and other sale pages, category hubs, developer and publisher pages, the personal calendar, the discovery queue preview, and on home page tabs you open after the page loads. Store cards whose picture arrives a moment after the rest of the card get their badge too, wishlist rows that load during a fast scroll keep their wishlist badge, and a carousel slide that switches to another game drops the previous game's badge.
