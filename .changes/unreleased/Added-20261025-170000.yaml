kind: Added
body: You can ignore a developer or a publisher. Below the entries, the banner on a game's page has a closed section, Ignore a developer or publisher, with a row for each developer and each publisher of the game and a button for each tag and one for all tags. A game is ignored for a tag when one of its developers is on your developer list or one of its publishers on your publisher list, so a studio's next release is covered at once. The settings page, the toolbar popup and the userscript dialog list them in two sections, with a Stop ignoring button. The extension reads the names from the data it already fetches for each game, to the same Valve API with no new permission, and tells a creator apart by its Steam group ID when Steam gives one and by its exact name otherwise. Stored lookup results from before are cleared once, so each game is checked again as you browse.
