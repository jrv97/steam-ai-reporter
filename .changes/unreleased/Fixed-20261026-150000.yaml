kind: Fixed
body: On a DLC's page, a tag list filter on Dim or Hide for the base game no longer fades or removes most of the page. The base game's tags now sit only on the small box at the top right that names the base game, and the DLC's header image, the side column, the purchase box and the description are left alone.
