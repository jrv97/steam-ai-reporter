kind: Changed
body: Hovering or tabbing to a badge or to the summary row on a game's page now opens a small panel, styled like Steam's own game hover, with the developer's AI disclosure in their own words and the AI service they named. It replaces the plain browser tooltip, which cut the text at 200 characters.
