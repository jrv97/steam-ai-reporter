kind: Added
body: You can name a tag's chips in your own words. Each tag's tab on the options page and in the userscript dialog has a Chip text field, used on badges, in the tag list of a game's page, on large game images, on the tag's tab, in the toolbar popup and on the banner's Ignore buttons, and a shorter one for small game images, each with a counter, a Reset button and a preview of both chips as you type. Leave a field empty for the usual text. On a Steam Deck or Steam Machine chip your text replaces the device word and Steam's rating stays after it. The hover panel, the banner's headings and the package summary keep Steam's words, and a screen reader now reads every chip's visible text first, then Steam's words, also for the rating and Family Sharing chips. The color square beside a tag's hex color field now opens your browser's color picker; the hex code stays beside it and follows the pick.
