kind: Added
body: A new tag, In-App Purchases, marks games whose Steam features list In-App Purchases, which the developer sets for the store page. The tag starts switched off; turn it on in the settings page, the toolbar popup or the userscript dialog, where it has its own badge, banner entry, list filter (Show, Dim or Hide) and color like every other tag, and ignoring a game, a developer or a publisher works for it too. Its chip reads IAP (Compras in Spanish), and the hover card and the banner use Steam's full name. A game whose features Steam does not send gets no tag either way, and a demo shows its full game's tag. Tag Kit reads it from the data it fetches for each game, with no new request. Stored lookup results from before are checked again once as you browse.
