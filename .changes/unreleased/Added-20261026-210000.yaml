kind: Added
body: Two new tags, Steam Deck Compatibility and Steam Machine Compatibility, show the rating Valve gives a game for each device, Verified, Playable or Unsupported. Both start switched off. Once you turn one on, its card in the settings page, the toolbar popup and the userscript dialog lets you pick which ratings to tag, Unsupported at first, and the chips read "Deck Unsupported" or "Steam Machine Playable". The badge, the banner entry (off at first) and the list filter (Show, Dim or Hide) act on the ratings you picked, and a change applies to the games on screen at once. A game Valve has not rated, such as an unreleased one, gets no tag, and a DLC shows its own rating only. The hover card ends with "According to Valve" for these tags. Tag Kit asks Steam for the ratings only while one of these tags is on, in the same batched request as the other tags, and asks once more for the games on screen when you turn one on. Stored lookup results from before are cleared once, so each game is checked again as you browse.
