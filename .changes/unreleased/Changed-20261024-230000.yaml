kind: Changed
body: Settings and the list of ignored games now live in a per-tag layout, so more kinds of store declarations can be added later. The first start after the update copies your badge, banner, list filter and language settings and your ignored games to the AI tag, and clears the stored lookup results once, so each game is checked again as you browse. Your old settings stay in storage as they were.
