kind: Changed
body: Settings and the list of ignored games now live in a per-category layout, so more kinds of store reports can be added later. The first start after the update moves your badge, banner, list filter and language settings and your ignored games over, and clears the stored lookup results once, so each game is checked again as you browse. Nothing changes in what you see.
