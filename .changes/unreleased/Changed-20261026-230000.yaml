kind: Changed
body: Settings now have a tab for each tag, sorted by the tag's name and marked On or Off, beside a General tab for the language, the color help, what you ignored for all tags, and the backup. Each tag's tab holds its switches and what you ignored for that tag alone, with a count of what all tags ignore and a way to it. On a wide window the tabs form a column on the left. The page remembers the last tab, and the userscript dialog shows the same tabs, now with the language picker. The toolbar popup is now a short list of the tags, each with its Show, Dim and Hide control and its switch; a tag's name opens its tab on the options page, and a gear at the top opens all settings. Stop ignoring and Reset are now quiet text buttons.
