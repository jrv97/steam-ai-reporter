kind: Added
body: The extension reads six more store declarations from the data it already fetches for each game. They are kernel-level anti-cheat, other anti-cheat, third-party DRM, a required third-party account, a third-party EULA and PvP modes. Each game shows one short chip per declared kind, such as Kernel AC or DRM, and a +N chip stands for the kinds that do not fit. A card on hover or keyboard focus lists every kind in Steam's own words and ends with a line that names the developer as the source. It sends no new request and asks for no new permission. Stored lookup results from before now lack these kinds, so those games are checked again as you browse.
