kind: Added
body: The extension reads six more store declarations from the data it already fetches for each game. They are kernel-level anti-cheat, other anti-cheat, third-party DRM, a required third-party account, a third-party EULA and PvP modes. Each game shows one short chip per kind, such as KLAC or DRM, and a +N chip stands for the kinds that do not fit. A card on hover or keyboard focus lists every kind in Steam's own words and ends with a line that names the developer as the source. The banner on a game's page lists every kind the developer declared as one line each, in Steam's words, with its own Ignore button, and keeps the developer's full text for AI. The PvP tag starts switched off and you can turn it on in the settings. The lookup is the one the extension already made, to the same Valve API with no new permission, and a game's own page now makes it too for a game not stored yet. Stored lookup results from before lack these kinds, so those games are checked again as you browse.
