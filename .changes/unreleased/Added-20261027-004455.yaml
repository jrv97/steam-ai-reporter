kind: Added
body: The settings now end in a bar of three links that stays in view on every tab, on the options page and in the userscript dialog, in English and Spanish. One reports a bug, one leaves feedback on GitHub, and one sends feedback or a bug report anonymously, with no account. The links open in a new tab, and the extension sends nothing when you use them.
