kind: Added
body: The settings have a Lookup results card that shows how many games Tag Kit keeps what Steam said about, and can clear them all or only the games Steam gave no answer for, so store pages look them up again. A Reset card puts every setting back to its default or stops ignoring every game, developer and publisher, each after a check that lists what changes.
