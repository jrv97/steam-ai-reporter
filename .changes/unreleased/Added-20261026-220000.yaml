kind: Added
body: A new tag, Family Sharing, reads the Family Sharing entry Valve computes in a game's Steam features. It starts switched off. Once you turn it on, its card in the settings page, the toolbar popup and the userscript dialog lets you pick which values to tag, Family Sharing or Family Sharing not Available, the second at first. A paid game whose Steam features leave Family Sharing out shows a "Family not Available" chip, and the hover card gives Steam's words, a line saying Family Sharing is not in the features Steam lists for the game, and "According to Valve". Free games, DLC, demos and games whose features Steam does not send never get that value; a demo shows its full game's tag. The badge, the banner entry (off at first) and the list filter (Show, Dim or Hide) act on the values you picked. Tag Kit reads it from the data it fetches for each game, with no new request. Stored lookup results from before are checked again once as you browse. A tag lent to a demo by Valve's data now reads "For the full game".
