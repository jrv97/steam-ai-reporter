kind: Added
body: Browser extension for Chrome and Firefox. On the Steam store, games whose developers disclose generative AI use get a "AI use disclosed" badge in search results and lists, and their store page shows the developer's disclosure in their own words. Lists can show, dim or hide these games, and you can stop marking a game you have checked. Settings live in the toolbar popup and the options page. Nothing is collected; game lookups go to Valve's own servers without your cookies.
