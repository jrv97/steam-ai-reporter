kind: Added
body: You can put the tags in your own order in a new Tag order card in the General tab. Drag a tag by its handle, or click its handle and then the handle of the place it goes to, or use Space, the arrow keys and Escape. Badges on rows and images, the hover panel, the tag list on a game's page, the banner and the package summary follow your order, and a small game image shows your first two. Reset order goes back to the usual order. The tabs stay sorted by name.
