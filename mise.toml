# :schema https://mise.jdx.dev/schema/mise.json
# Toolchain and task runner for local development, Git hooks and CI (AGENTS.md rule 14).
# Programs are pinned here; JavaScript libraries are pinned in package.json and pnpm-lock.yaml.
# Machine-specific values (browser paths, Git Bash on Windows) go in mise.local.toml; see
# mise.local.toml.example.

min_version = "2026.10.15"

[tools]
node = "24.14.0"
pnpm = "12.14.0"
python = "3.14.8"
uv = "0.13.1"
changie = "1.26.0"
"npm:web-ext" = "10.8.0"
dprint = "0.64.0"
ruff = "0.17.1"
"pypi:mypy" = "2.4.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
gh = "2.102.0"

[settings]
locked = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Setup

[tasks.setup]
description = "Install tools and dependencies, write the Git hooks, check the browser paths"
run = [
  "mise install",
  "pnpm install --frozen-lockfile",
  "mise run hooks",
  "python scripts/run_browser.py gecko --check",
]

[tasks.hooks]
description = "Write the pre-commit and pre-push Git hooks"
run = [
  "mise generate git-pre-commit --write --task=precommit",
  "mise generate git-pre-commit --write --hook=pre-push --task=prepush",
]

[tasks.gen]
description = "Generate the typed message keys, the shipped catalogs and the stylesheet constants"
hide = true
sources = [
  "src/locales/*/messages.json",
  "tests/locales/en/messages.json",
  "docs/design/tokens.css",
  "src/core/ui/*.css",
  "scripts/*.py",
]
outputs = [
  "src/core/i18n/keys.gen.ts",
  "src/core/i18n/shipped.gen.ts",
  "tests/locales/keys.gen.ts",
  "src/core/ui/styles.gen.ts",
]
run = [
  "python scripts/gen_i18n_keys.py",
  "python scripts/gen_catalogs.py",
  "python scripts/gen_styles.py",
]

[tasks.deps]
description = "Install JavaScript dependencies from the lockfile"
hide = true
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.modules.yaml"]
run = "pnpm install --frozen-lockfile"

# Formatting

[tasks.fmt]
description = "Format every file we own"
run = [
  "dprint fmt",
  "ruff format",
  "shfmt --indent 2 --case-indent --write scripts",
]

[tasks.fmt-check]
description = "Fail on any unformatted file"
run = [
  "dprint check",
  "ruff format --check",
  "shfmt --indent 2 --case-indent --diff scripts",
]

# Static checks

[tasks.lint]
description = "Lint TypeScript, Python, shell scripts and workflows"
depends = ["deps", "gen"]
run = [
  "oxlint --type-aware --deny-warnings",
  "ruff check",
  "mypy --strict scripts posting/scripts",
  "python scripts/lint_shell.py",
  "actionlint",
  "zizmor --offline .github/workflows",
]

[tasks.typecheck]
description = "Type-check the project and the core with TypeScript 7"
depends = ["deps", "gen"]
run = ["tsc --noEmit -p tsconfig.json", "tsc --noEmit -p tsconfig.core.json"]

[tasks.test]
description = "Run the unit tests"
depends = ["deps", "gen"]
run = "vitest run"

[tasks.check]
description = "Check text hygiene, versions, message catalogs and the built bundles"
depends = ["build"]
run = [
  "python scripts/check_text.py",
  "python scripts/check_versions.py",
  "python scripts/check_i18n.py",
  "python scripts/check_bundle.py",
]

[tasks.check-branch]
description = "Check that the branch name is <type>/<slug>"
run = "python scripts/check_branch.py"

[tasks.check-reproducible]
description = "Build twice and compare the outputs byte for byte"
depends = ["deps", "gen"]
run = "bash scripts/check_reproducible.sh"

[tasks.changelog-gate]
description = "Fail a pull request that changes src/ without a changie fragment"
run = "python scripts/changelog_gate.py"

# Build and run

[tasks.build]
description = "Build the Chromium and Gecko extensions, the userscript and the dev bundle"
depends = ["deps", "gen"]
run = "python scripts/build.py"

[tasks.dev]
description = "Rebuild every target on change"
depends = ["deps", "gen"]
run = "python scripts/build.py --watch"

[tasks.icons]
description = "Render the extension icon PNGs from the purple mark with headless Chromium"
run = "python scripts/render_icons.py"

[tasks.lint-gecko]
description = "Run web-ext lint on the Gecko build"
depends = ["build"]
run = "web-ext lint --source-dir dist/gecko --warnings-as-errors"

[tasks.run-gecko]
description = "Run the Gecko build in Firefox Nightly ($SAR_GECKO_BIN) with auto-reload"
depends = ["build"]
run = "python scripts/run_browser.py gecko"

[tasks.run-chromium]
description = "Run the Chromium build in Chromium ($SAR_CHROMIUM_BIN) with auto-reload"
depends = ["build"]
run = "python scripts/run_browser.py chromium"

[tasks.package]
description = "Write the store zips, the userscript and the AMO source archive to artifacts/"
depends = ["build"]
run = ["bash scripts/package.sh", "python scripts/check_bundle.py"]

[tasks.canary]
description = "Check live Steam still has the shape the detectors expect (four requests; not in ci)"
run = "python scripts/canary.py"

[tasks.capture-fixtures]
description = "Refresh the public test fixtures from the live store (cookie-less)"
run = "python scripts/capture_fixtures.py"

# Changelog

[tasks.change-new]
description = "Add a changie fragment for this change"
run = "changie new"

# Release (ADR 0005; logic in scripts/calver.py and scripts/release.py)

[tasks."release:test"]
description = "Run the unit tests of the release scripts"
run = "python -m unittest discover --start-directory scripts --pattern test_*.py"

[tasks."release:train"]
description = "Open the release batch PR from the newest green main (DRY_RUN=true only reports)"
run = "python scripts/release.py train"

[tasks."release:tag"]
description = "Tag a merged release batch commit ($RELEASE_SHA) and dispatch the nightly"
run = "python scripts/release.py tag"

[tasks."release:nightly"]
description = "Validate $RELEASE_TAG, build, check, package, and create the GitHub prerelease"
run = [
  "python scripts/release.py validate",
  { task = "check-reproducible" },
  { task = "package" },
  "python scripts/release.py publish-nightly",
]

[tasks."release:validate"]
description = "Re-validate $RELEASE_TAG and its prerelease assets before a store promotion"
run = "python scripts/release.py validate --release"

[tasks."release:chrome"]
description = "Promote the $RELEASE_TAG prerelease's Chromium zip to the Chrome Web Store"
run = "python scripts/release.py chrome"

[tasks."release:amo"]
description = "Promote the $RELEASE_TAG prerelease's Gecko and source zips to AMO (listed)"
run = "python scripts/release.py amo"

[tasks."release:latest"]
description = "Mark the $RELEASE_TAG release as latest, which updates userscript installs"
run = "python scripts/release.py latest"

# Hooks and CI

[tasks.precommit]
description = "Format staged files we own, re-stage them, and check their text"
run = [
  "bash scripts/precommit_format.sh",
  "python scripts/check_text.py --staged",
  "python scripts/check_i18n.py",
]

[tasks.prepush]
description = "Everything a push must pass"
run = [
  { task = "check-branch" },
  { task = "fmt-check" },
  { tasks = ["lint", "typecheck", "test", "release:test"] },
  { task = "check" },
]

[tasks.ci]
description = "Everything CI runs: prepush plus reproducibility and web-ext lint"
run = [
  { task = "prepush" },
  { task = "check-reproducible" },
  { task = "lint-gecko" },
]
