<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<title>Allow-list</title>
<style>
  body { margin: 0; background: var(--sar-color-bg-panel); }
  .sar-options { max-inline-size: 440px; margin: 0; }
</style>
</head>
<body>
<div class="sar-options" data-sar-context="page">
  <section class="sar-card" aria-labelledby="a">
    <h2 class="sar-card-title" id="a">Games you stopped marking</h2>
    <ul class="sar-allow-list">
      <li class="sar-allow-item">
        <div>
          <a class="sar-allow-name" href="#">A game with an upscaling-only disclosure and a long
            name</a>
          <span class="sar-allow-meta">Since Oct 20, 2026</span>
        </div>
        <button
            class="sar-button"
            type="button"
            aria-label="Mark A game with an upscaling-only disclosure and a long name again">
          Mark again</button>
      </li>
      <li class="sar-allow-item">
        <div>
          <a class="sar-allow-name" href="#">Another game</a>
          <span class="sar-allow-meta">Since Sep 2, 2026</span>
        </div>
        <button class="sar-button" type="button" aria-label="Mark Another game again">Mark again
          </button>
      </li>
    </ul>
  </section>
  <section class="sar-card" aria-labelledby="b">
    <h2 class="sar-card-title" id="b">Games you stopped marking</h2>
    <p class="sar-empty">None yet. Use "Stop marking this game" on a game page.</p>
  </section>
</div>
</body>
</html>
