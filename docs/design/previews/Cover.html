<title>Tag Kit for Steam</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--sar-color-bg-page);
    color: var(--sar-color-text-strong);
    font-family: var(--sar-font-page);
    overflow: hidden;
  }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 520px; height: 288px; }
  .brand { fill: var(--sar-accent-400); }
  .deep { fill: var(--sar-accent-600); }
  .light { fill: var(--sar-accent-300); }
  .tint { fill: var(--sar-accent-100); }
  .cut { color: var(--sar-color-bg-page); }
  .mark { color: var(--sar-accent-100); }
  .blk { rx: var(--sar-radius-md); }
  .chip { rx: var(--sar-radius-sm); }
  .words {
    position: absolute;
    left: var(--sar-space-6);
    bottom: var(--sar-space-6);
    max-width: 440px;
  }
  .name {
    margin: 0;
    font-size: 66px;
    line-height: 0.95;
    font-weight: var(--sar-weight-medium);
    letter-spacing: -0.01em;
    color: var(--sar-color-text-strong);
  }
  .tag {
    margin: var(--sar-space-2) 0 0 2px;
    font-size: 14px;
    line-height: 20px;
    color: var(--sar-color-text-muted);
  }
</style>
</head>

<!--
  blocks sar-accent-400 192x232 slab bled off the top (the brand fill, largest) &#xb7;
    sar-accent-600 144x160 &#xb7; sar-accent-300 112x104 bled off the right edge &#xb7;
    sar-accent-100 56x20, the full badge's own height (sar-badge-height), once &#xb7; about 27% of
    960x288
  arrangement one tall slab with satellites, bottoms on one line sar-space-6 x2 above the edge,
    sar-space-4 gutters, like capsules in a store row
  pattern the mark as texture, the system's literal motif (a Steam badge with a tag, section 14):
    12px marks, too small to read as icons, on an sar-space-6 pitch rising in two steps toward
    inline-end, the way the tag points; cut from the slab in the page ground, laid on accent 600
    in accent 100
  scales sides in sar-space-2 multiples; gutters sar-space-4; pitch sar-space-6; block corners
    sar-radius-md, the badge chip sar-radius-sm
-->
