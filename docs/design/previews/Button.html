<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<title>Button</title>
<style>
  body { margin: 0; background: var(--sar-color-bg-panel); }
  .sar-options { max-inline-size: 440px; margin: 0; }
  .sar-card { display: flex; flex-wrap: wrap; gap: var(--sar-space-3); align-items: center; }
</style>
</head>
<body>
<div class="sar-options" data-sar-context="page">
  <div class="sar-card">
    <button class="sar-button" type="button" aria-label="Mark Example Game again">Mark again
      </button>
    <button class="sar-button" type="button" lang="es">Volver a marcar</button>
    <button class="sar-button" data-sar-variant="primary" type="button">Restore</button>
  </div>
</div>
</body>
</html>
