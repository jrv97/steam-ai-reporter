<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<title>Button</title>
<style>
  body { margin: 0; background: var(--tks-color-bg-panel); }
  .tks-options { max-inline-size: 440px; margin: 0; }
  .tks-card { display: flex; flex-wrap: wrap; gap: var(--tks-space-3); align-items: center; }
</style>
</head>
<body>
<div class="tks-options" data-tks-context="page">
  <div class="tks-card">
    <button class="tks-button" type="button" aria-label="Stop ignoring Example Game">
      Stop ignoring</button>
    <button class="tks-button" type="button" lang="es">Dejar de ignorar</button>
    <button class="tks-button" data-tks-variant="primary" type="button">Restore</button>
  </div>
</div>
</body>
</html>
