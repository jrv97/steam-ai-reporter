<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<title>Switch</title>
<style>
  body { margin: 0; background: var(--sar-color-bg-panel); }
  .sar-options { max-inline-size: 440px; margin: 0; }
</style>
</head>
<body>
<div class="sar-options" data-sar-context="page">
  <section class="sar-card" aria-labelledby="s">
    <h2 class="sar-card-title" id="s">On store pages</h2>
    <label class="sar-field">
      <span class="sar-field-label">Badges on games that disclose AI use</span>
      <input class="sar-toggle" type="checkbox" role="switch" checked>
      <span class="sar-field-help">Adds "AI use disclosed" to search and wishlist rows and "AI
        disclosed" to game images.</span>
    </label>
    <label class="sar-field">
      <span class="sar-field-label">Banner on game pages</span>
      <input class="sar-toggle" type="checkbox" role="switch">
      <span class="sar-field-help">Shows the developer's disclosure above the purchase box.</span>
    </label>
  </section>
</div>
</body>
</html>
