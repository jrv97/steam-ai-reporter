<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280">
    <title>Tag Kit for Steam, social preview</title>
    <link rel="stylesheet" href="../../design/tokens.css">
    <link rel="stylesheet" href="graphics.css">
    <style>
    /* GitHub social preview, 1280 x 640 */
    :root {
      --w: 1280px;
      --h: 640px;
      --pad: 80px;
      --gap: 56px;
      --mark: 220px;
      --title: 88px;
      --tagline: 34px;
      --tagline-gap: 16px;
      --more: 26px;
      --chips-gap: 32px;
      --chip-gap: 12px;
      --k: 2.3;
    }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="mark" src="../../../assets/icons/mark-purple.svg" alt="">
      <div class="copy">
        <div class="title">Tag Kit for Steam</div>
        <p class="tagline">Tags Steam games with what Steam reports.</p>
        <div class="chips">
          <span class="chip">AI Generated Content Disclosure</span>
          <span class="chip">Kernel Level Anti-Cheat</span>
          <span class="chip">Anti-Cheat</span>
          <span class="chip">3rd-party DRM</span>
          <span class="chip">3rd-Party Account</span>
          <span class="chip">3rd-party EULA</span>
          <span class="chip">PvP</span>
          <span class="chip">In-App Purchases</span>
          <span class="chip">Early Access</span>
          <span class="chip">No Family Sharing</span>
          <span class="chip">Steam Deck Verified</span>
          <span class="chip">Steam Machine Verified</span>
        </div>
      </div>
    </div>
  </body>
</html>
