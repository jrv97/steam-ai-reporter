<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1400">
    <title>Tag Kit for Steam, marquee</title>
    <link rel="stylesheet" href="../../design/tokens.css">
    <link rel="stylesheet" href="graphics.css">
    <style>
    /* Marquee promo tile, 1400 x 560 */
    :root {
      --w: 1400px;
      --h: 560px;
      --pad: 90px;
      --gap: 60px;
      --mark: 240px;
      --title: 100px;
      --tagline: 40px;
      --tagline-gap: 20px;
      --more: 28px;
      --chips-gap: 48px;
      --chip-gap: 16px;
      --k: 2.8;
    }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="mark" src="../../../assets/icons/mark-purple.svg" alt="">
      <div class="copy">
        <div class="title">Tag Kit for Steam</div>
        <p class="tagline">Tags Steam games with what Steam reports.</p>
        <p class="more">AI disclosure, anti-cheat, DRM, Steam Deck, Family Sharing and more.</p>
        <div class="chips">
          <span class="chip">AI</span>
          <span class="chip">KLAC</span>
          <span class="chip">DRM</span>
          <span class="chip">PvP</span>
        </div>
        <div class="chips next">
          <span class="chip">Deck Verified</span>
          <span class="chip">No Family Sharing</span>
        </div>
      </div>
    </div>
  </body>
</html>
