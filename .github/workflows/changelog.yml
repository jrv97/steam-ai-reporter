# Fails a pull request that changes src/ without a changie fragment, unless it carries the
# no-changelog-fragment label. A separate workflow, so adding or removing the label reruns only
# this gate and not the whole CI.
name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# No concurrency group: a cancelled run of a required check blocks the merge.
# Renovate opens a PR and labels it at once, and the two runs must both finish.

jobs:
  changelog-fragment:
    name: changelog fragment
    # A label event reruns the gate only for the label the gate reads.
    if: >-
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) ||
      github.event.label.name == 'no-changelog-fragment'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: python
      - run: mise run changelog-gate
