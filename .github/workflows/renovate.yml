# Self-hosted Renovate (ADR 0021), every six hours and on demand. Renovate opens dependency PRs
# on build/ branches as the dependencies app, which lets CI run on them. It enables auto-merge
# on security fixes, patch updates and lockfile maintenance; GitHub merges them once checks pass.
name: renovate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: mise run renovate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false
          cache: false
      - run: mise run renovate
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
