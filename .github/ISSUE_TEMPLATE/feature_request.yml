name: Feature request
description: Suggest a new Steam surface, tag, display option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do that the extension does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Where should this work?
      options:
        - label: Steam store page
        - label: Search and browse results
        - label: Wishlist and library
        - label: Userscript version
        - label: Extension settings
