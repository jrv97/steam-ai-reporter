<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ARC Raiders on Steam</title></head>
<body class="v6 app game_bg menu_background_overlap application widestore v7menu responsive_page store_menu_hidden">
<div class="queue_actions_ctn">
<div id="ignoreBtn" style="position: relative; display: flex;">
<div class="queue_control_button queue_btn_ignore">
<button class="btnv6_blue_hoverfade  btn_medium queue_btn_inactive" role="button" style="" data-tooltip-text="Ignored titles will not be recommended to you and will not appear in featured areas.">
<span>Ignore</span>
</button>
<button class="btnv6_blue_hoverfade  btn_medium queue_btn_active" role="button" style="display: none;" data-tooltip-text="Ignored titles will not be recommended to you and will not appear in featured areas.">
<span><img src="https://store.fastly.steamstatic.com/public/images/v6/ico/ico_selected.png" border="0"> Ignored</span>
</button>
</div>
<div id="queue_btn_ignore_menu" class="queue_control_button queue_btn_menu">
<button class="queue_menu_arrow btn_medium" id="queue_ignore_menu_arrow" aria-haspopup="menu" aria-expanded="false" aria-controls="ignore_menu_flyout">
<span><img alt="Ignore options" src="https://store.fastly.steamstatic.com/public/images/v6/btn_arrow_down_padded.png"></span>
</button>
<div class="queue_menu_flyout" id="ignore_menu_flyout" role="menu">
<div class="queue_menu_flyout_content">
<button class="queue_menu_option" role="menuitem" id="queue_ignore_menu_option_not_interested">
<div>
<img class="queue_ignore_menu_option_image selected" src="https://store.fastly.steamstatic.com/public/images/v6/ico/ico_selected_bright.png">
<img class="queue_ignore_menu_option_image unselected" src="https://store.fastly.steamstatic.com/public/images/v6/ico/ico_unselected_bright.png">
</div>
<div class="queue_menu_option_label">
<div class="option_title">Ignore This (Default)</div>
<div class="option_subtitle">Hide from store, ignore notifications, and don't use this to generate other recommendations.</div>
</div>
</button>
<button class="queue_menu_option" role="menuitem" id="queue_ignore_menu_option_owned_elsewhere">
<div>
<img class="queue_ignore_menu_option_image selected" src="https://store.fastly.steamstatic.com/public/images/v6/ico/ico_selected_bright.png">
<img class="queue_ignore_menu_option_image unselected" src="https://store.fastly.steamstatic.com/public/images/v6/ico/ico_unselected_bright.png">
</div>
<div class="queue_menu_option_label">
<div class="option_title">Played on Another Platform</div>
<div class="option_subtitle">Hide from store. Can be used to generate recommendations.</div>
</div>
</button>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
